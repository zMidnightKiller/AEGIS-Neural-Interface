[project]
name = "aegis-ai"
version = "0.1.0"
description = "Adaptive Engineered General Intelligence System (AEGIS)"
authors = [{ name = "Luan", email = "luan@example.com" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "anthropic>=0.30.0",
    "langchain>=0.1.0",
    "redis>=5.0.0",
    "chromadb>=0.4.0",
    "httpx>=0.25.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "neo4j>=5.14.0",
    "docker>=7.0.0",
    "celery>=5.3.0",
    "langfuse>=2.0.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "apscheduler>=3.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
